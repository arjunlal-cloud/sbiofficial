openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /forms/{kind}:
    post:
      operationId: submitSbiForm
      tags: [forms]
      summary: Submit an SBI chapter or business form
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [application, business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SbiFormSubmissionInput"
      responses:
        "202":
          description: Submission email accepted by the delivery provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbiFormSubmissionAccepted"
        "400":
          description: Invalid form submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /forms/status:
    get:
      operationId: getSbiFormStatus
      tags: [forms]
      summary: Check whether SBI form email delivery is configured
      responses:
        "200":
          description: Email delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbiFormStatus"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SbiFormSubmissionInput:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
        website:
          type: string
      required: [answers]
    SbiFormSubmissionAccepted:
      type: object
      properties:
        message:
          type: string
      required: [message]
    SbiFormStatus:
      type: object
      properties:
        ready:
          type: boolean
      required: [ready]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
